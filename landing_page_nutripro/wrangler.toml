# Cloudflare Pages: sito statico (dist/) + Functions (functions/) + database D1 per la waitlist.
name = "nutra"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nutra-waitlist"
# Da sostituire con l'id reale dopo `npx wrangler d1 create nutra-waitlist` (fase 7).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
